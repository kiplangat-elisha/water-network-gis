[project]
name = "water-network-gis"
version = "0.1.0"
requires-python = ">=3.11"
authors = [{ name = "Kiplangat Elisha" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
